<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 316" width="1200" height="316" role="img" aria-label="Stack manifest. Languages: Python, TypeScript, SQL, Bash, C and C++. Agents and LLM: orchestration, tool calling, context management, RAG, evaluation harnesses. Backend: FastAPI, Postgres, Redis, SQLAlchemy, Next.js. Infrastructure: Docker, Swarm, Azure, Bedrock, RunPod, GPU serving T4 to H100. ML: PyTorch, Transformers, ONNX Runtime, OpenCV, YOLO. Current focus: agent evaluation and benchmarking, retrieval and context systems, LLM serving at scale.">
  <rect width="1200" height="316" rx="10" fill="#0B1416"/>
